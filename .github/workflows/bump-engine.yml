name: bump-engine

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest upstream release tag
        id: up
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/ec-/Quake3e \
            | sed 's#.*refs/tags/##' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)
          [ -n "$tag" ] || exit 1
          echo "$tag" > QUAKE3E_REF
          sed -i "s/^appVersion:.*/appVersion: \"$tag\"/" helm/quake3e/Chart.yaml
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump-engine
          commit-message: "bump quake3e to ${{ steps.up.outputs.tag }}"
          title: "bump quake3e to ${{ steps.up.outputs.tag }}"
          body: "Upstream: https://github.com/ec-/Quake3e/releases/tag/${{ steps.up.outputs.tag }}"
