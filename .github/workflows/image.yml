name: image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - server.cfg
      - QUAKE3E_REF
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read engine ref
        id: ref
        run: echo "ref=$(tr -d "[:space:]" < QUAKE3E_REF)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kbnchk/quake3e:${{ steps.ref.outputs.ref }}
            ghcr.io/kbnchk/quake3e:latest

      - name: Keep only the 2 newest image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: quake3e
          package-type: container
          min-versions-to-keep: 2
