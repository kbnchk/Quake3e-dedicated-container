services:
  quake3e:
    image: ghcr.io/kbnchk/quake3e:latest
    environment:
      RCON_PASSWORD: changeme
      TZ: Europe/Moscow
    ports:
      - "27960:27960/udp"
    volumes:
      - /path/to/baseq3:/mnt/paks:ro
      - ./server.cfg:/config/server.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "printf '\\377\\377\\377\\377getinfo\\n' | nc -u -w 2 127.0.0.1 27960 | grep -q infoResponse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
